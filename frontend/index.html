<!DOCTYPE html>
<html>
<head>
    <title>Whiteredbit</title>
</head>
<body>

<h1 id="message">Loading...</h1>

<script>
    fetch('/api/message')
        .then(response => response.json())
        .then(data => {
            document.getElementById('message').innerText = data.message;
        });
</script>

</body>
</html>
